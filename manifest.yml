---
applications:
  - name: bom-cost-mcp
    memory: 256M
    disk_quota: 512M
    buildpacks:
      - nodejs_buildpack
    command: node srv/server.js
    health-check-type: http
    health-check-http-endpoint: /health
    env:
      NODE_ENV: production
      DEST_NAME: S4HANA_COST_OPT
    services:
      - bom-cost-destination
